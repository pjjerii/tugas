<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buku tamu dan pesan pengunjung">
    <title>Buku Tamu</title>

    <link rel="stylesheet" href="style.css">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(circle at 8% 8%, rgba(255,255,255,.75), transparent 25%),
                radial-gradient(circle at 92% 88%, rgba(64,145,255,.25), transparent 30%),
                linear-gradient(135deg, #38b8ed 0%, #77ccef 42%, #b9e4f7 100%);
            color: #17264a;
            padding: 22px 14px 45px;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(2px);
            pointer-events: none;
        }

        body::before {
            width: 230px;
            height: 230px;
            top: 9%;
            left: -90px;
            background: rgba(255,255,255,.18);
        }

        body::after {
            width: 280px;
            height: 280px;
            right: -110px;
            bottom: 4%;
            background: rgba(30,130,240,.16);
        }

        .guest-page {
            width: min(100%, 680px);
            margin: auto;
        }

        .guest-card,
        .guest-messages-section {
            width: 100%;
            background: rgba(244,251,255,.91);
            border: 1px solid rgba(255,255,255,.9);
            box-shadow:
                0 22px 55px rgba(31,93,145,.18),
                0 5px 18px rgba(31,93,145,.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* FORM KIRIM PESAN */

        .guest-card {
            padding: 38px 30px 34px;
            border-radius: 32px;
            transform: translateY(0);
            transition: .3s ease;
        }

        .guest-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 28px 65px rgba(31,93,145,.22),
                0 6px 20px rgba(31,93,145,.1);
        }

        .guest-head {
            text-align: center;
            margin-bottom: 28px;
        }

        .guest-head .welcome {
            display: inline-block;
            padding: 7px 16px;
            margin-bottom: 12px;
            border-radius: 50px;
            background: #e7f5fd;
            border: 1px solid #d0ebf9;
            color: #247ac5;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2.8px;
        }

        .guest-head h1 {
            margin: 0;
            color: #17264a;
            font-size: clamp(27px, 7vw, 38px);
            font-weight: 800;
            letter-spacing: -.7px;
        }

        .guest-head p {
            margin: 9px auto 0;
            max-width: 500px;
            color: #7b8da5;
            font-size: 13px;
            line-height: 1.7;
        }

        .guest-form {
            display: grid;
            gap: 15px;
        }

        .guest-field label {
            display: block;
            margin: 0 0 7px 3px;
            color: #344765;
            font-size: 11px;
            font-weight: 700;
        }

        .guest-field input,
        .guest-field textarea {
            width: 100%;
            border: 1px solid #dbeaf3;
            border-radius: 16px;
            outline: none;
            padding: 14px 16px;
            background: rgba(255,255,255,.86);
            color: #263957;
            font-family: inherit;
            font-size: 13px;
            box-shadow: inset 0 1px 3px rgba(45,93,130,.04);
            transition: .25s ease;
        }

        .guest-field textarea {
            min-height: 125px;
            resize: vertical;
        }

        .guest-field input::placeholder,
        .guest-field textarea::placeholder {
            color: #a0afbf;
        }

        .guest-field input:focus,
        .guest-field textarea:focus {
            border-color: #5bb9ef;
            background: #fff;
            box-shadow:
                0 0 0 3px rgba(65,169,232,.12),
                0 9px 24px rgba(54,127,175,.08);
        }

        .guest-submit {
            width: 100%;
            min-height: 54px;
            margin-top: 3px;
            border: 0;
            border-radius: 17px;
            background: linear-gradient(135deg, #168fe0, #367cf0);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(45,126,221,.25);
            transition: .25s ease;
        }

        .guest-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 17px 30px rgba(45,126,221,.31);
        }

        .guest-submit:active {
            transform: translateY(0);
        }

        .guest-submit:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        .guest-status {
            min-height: 20px;
            margin-top: -1px;
            text-align: center;
            color: #8494a8;
            font-size: 11px;
        }

        .guest-status.success {
            color: #15936a;
        }

        .guest-status.error {
            color: #df5b63;
        }

        /* PESAN TAMU */

        .guest-messages-section {
            margin-top: 22px;
            padding: 30px;
            border-radius: 32px;
        }

        .guest-messages-title {
            margin: 0 0 22px;
            text-align: center;
            color: #17264a;
            font-size: clamp(23px, 6vw, 31px);
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .guest-messages-title span {
            display: block;
            margin-top: 4px;
            color: #8b9aae;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .guest-messages {
            display: grid;
            gap: 13px;
        }

        .guest-message {
            position: relative;
            padding: 17px 18px;
            border: 1px solid #e0edf5;
            border-radius: 19px;
            background: rgba(255,255,255,.88);
            box-shadow: 0 10px 25px rgba(44,98,135,.08);
            transition: .25s ease;
        }

        .guest-message::before {
            content: "";
            position: absolute;
            left: 0;
            top: 17px;
            bottom: 17px;
            width: 3px;
            border-radius: 5px;
            background: linear-gradient(#2aa9e9, #467bf0);
        }

        .guest-message:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(44,98,135,.13);
        }

        .guest-message-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .guest-message-name {
            color: #277bc3;
            font-size: 14px;
            font-weight: 700;
        }

        .guest-message-time {
            color: #9ba9b8;
            font-size: 10px;
            text-align: right;
            white-space: nowrap;
        }

        .guest-message-contact {
            margin-top: 4px;
            color: #93a2b2;
            font-size: 10px;
        }

        .guest-message-text {
            margin-top: 11px;
            padding-top: 10px;
            border-top: 1px solid #eaf1f5;
            color: #566b84;
            font-size: 13px;
            line-height: 1.75;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .guest-empty,
        .guest-loading {
            padding: 20px;
            border: 1px solid #e0edf5;
            border-radius: 17px;
            background: rgba(255,255,255,.72);
            color: #8e9daf;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 520px) {
            body {
                padding: 14px 10px 30px;
            }

            .guest-card {
                padding: 30px 18px 27px;
                border-radius: 27px;
            }

            .guest-messages-section {
                padding: 25px 18px;
                border-radius: 27px;
            }

            .guest-message-top {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .guest-message-time {
                text-align: left;
            }
        }

    </style>
</head>

<body>

    <main class="guest-page">

        <!-- =========================
             FORM KIRIM PESAN
        ========================== -->

        <section class="guest-card">

            <div class="guest-head">
                <div class="welcome">BUKU TAMU</div>

                <h1>Kirim Pesan</h1>

                <p>
                    Silakan isi form di bawah untuk meninggalkan
                    pesan.
                </p>
            </div>

            <form class="guest-form" id="guestForm">

                <div class="guest-field">
                    <label for="nama">Nama</label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama kamu"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="guest-field">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="guest-field">
                    <label for="telepon">No. Telepon</label>

                    <input
                        type="tel"
                        id="telepon"
                        name="telepon"
                        placeholder="Masukkan nomor telepon"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="guest-field">
                    <label for="pesan">Pesan</label>

                    <textarea
                        id="pesan"
                        name="pesan"
                        placeholder="Tulis pesan kamu di sini..."
                        required
                    ></textarea>
                </div>

                <button
                    class="guest-submit"
                    id="sendButton"
                    type="submit"
                >
                    Kirim Pesan
                </button>

                <div
                    class="guest-status"
                    id="status"
                    aria-live="polite"
                ></div>

            </form>

        </section>


        <!-- =========================
             PESAN YANG SUDAH TERKIRIM
        ========================== -->

        <section class="guest-messages-section">

            <h2 class="guest-messages-title">
                Pesan Tamu
                <span>Pesan yang telah dikirim</span>
            </h2>

            <div
                class="guest-messages"
                id="messages"
            >
                <div class="guest-loading">
                    Memuat pesan...
                </div>
            </div>

        </section>

    </main>


    <script>

        /* =================================
           MASUKKAN URL GOOGLE APPS SCRIPT
        ================================== */

        const SCRIPT_URL =
            "MASUKKAN_URL_WEB_APP_DI_SINI";


        const form =
            document.getElementById("guestForm");

        const sendButton =
            document.getElementById("sendButton");

        const statusBox =
            document.getElementById("status");

        const messagesBox =
            document.getElementById("messages");


        /* =================================
           CEK KONEKSI
        ================================== */

        function isConnected() {

            return SCRIPT_URL &&
                !SCRIPT_URL.includes(
                    "MASUKKAN_URL_WEB_APP"
                );

        }


        /* =================================
           KEAMANAN HTML
        ================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/[&<>"']/g, function(char) {

                    const entities = {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#039;"
                    };

                    return entities[char];

                });

        }


        /* =================================
           STATUS
        ================================== */

        function showStatus(
            message,
            type = ""
        ) {

            statusBox.textContent = message;

            statusBox.className =
                "guest-status " + type;

        }


        /* =================================
           TAMPILKAN PESAN
        ================================== */

        function renderMessages(data) {

            if (
                !Array.isArray(data) ||
                data.length === 0
            ) {

                messagesBox.innerHTML =
                    '<div class="guest-empty">' +
                    'Belum ada pesan dari tamu.' +
                    '</div>';

                return;

            }


            messagesBox.innerHTML =
                data.map(function(item) {

                    return `
                        <article class="guest-message">

                            <div class="guest-message-top">

                                <div class="guest-message-name">
                                    ${escapeHTML(item.nama)}
                                </div>

                                <div class="guest-message-time">
                                    ${escapeHTML(item.waktu)}
                                </div>

                            </div>

                            <div class="guest-message-contact">
                                ${escapeHTML(item.email)}
                                &nbsp;•&nbsp;
                                ${escapeHTML(item.telepon)}
                            </div>

                            <div class="guest-message-text">
                                ${escapeHTML(item.pesan)}
                            </div>

                        </article>
                    `;

                }).join("");

        }


        /* =================================
           AMBIL PESAN DARI GOOGLE SHEETS
        ================================== */

        function loadMessages() {

            if (!isConnected()) {

                messagesBox.innerHTML =
                    '<div class="guest-empty">' +
                    'URL Google Apps Script belum dipasang.' +
                    '</div>';

                return;

            }


            const callbackName =
                "guestCallback_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() * 1000
                );


            const script =
                document.createElement("script");


            window[callbackName] =
                function(data) {

                    renderMessages(data);

                    delete window[callbackName];

                    script.remove();

                };


            script.onerror =
                function() {

                    messagesBox.innerHTML =
                        '<div class="guest-empty">' +
                        'Pesan tidak dapat dimuat. ' +
                        'Periksa URL Apps Script.' +
                        '</div>';

                    delete window[callbackName];

                    script.remove();

                };


            script.src =
                SCRIPT_URL +
                "?action=list&callback=" +
                encodeURIComponent(
                    callbackName
                );


            document.body.appendChild(script);

        }


        /* =================================
           KIRIM PESAN
        ================================== */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (!isConnected()) {

                    showStatus(
                        "URL Google Apps Script belum dipasang.",
                        "error"
                    );

                    return;

                }


                const nama =
                    document
                        .getElementById("nama")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const telepon =
                    document
                        .getElementById("telepon")
                        .value
                        .trim();


                const pesan =
                    document
                        .getElementById("pesan")
                        .value
                        .trim();


                if (
                    !nama ||
                    !email ||
                    !telepon ||
                    !pesan
                ) {

                    showStatus(
                        "Semua kolom wajib diisi.",
                        "error"
                    );

                    return;

                }


                sendButton.disabled = true;

                sendButton.textContent =
                    "Mengirim...";


                showStatus(
                    "Pesan sedang dikirim..."
                );


                const params =
                    new URLSearchParams({

                        action: "send",

                        nama: nama,

                        email: email,

                        telepon: telepon,

                        pesan: pesan

                    });


                try {

                    await fetch(

                        SCRIPT_URL +
                        "?" +
                        params.toString(),

                        {
                            method: "GET",
                            mode: "no-cors"
                        }

                    );


                    form.reset();


                    showStatus(
                        "Pesan berhasil dikirim ✓",
                        "success"
                    );


                    setTimeout(
                        loadMessages,
                        1000
                    );


                } catch (error) {

                    console.error(error);

                    showStatus(
                        "Gagal mengirim pesan. Coba lagi.",
                        "error"
                    );

                } finally {

                    setTimeout(
